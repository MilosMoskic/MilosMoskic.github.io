  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

esc { margin-top: 3px; font-size: 13px; color: #5b6670; line-height: 1.35; }\n  .mm-step:hover .mm-step-dot { background: oklch(0.74 0.14 68); color: #16202b; transform: scale(1.15); }\n  .mm-step:hover .mm-step-title { color: oklch(0.55 0.13 60); }\n  @keyframes mm-dot-on {\n    0% { box-shadow: 0 0 0 0 oklch(0.74 0.14 68 / 0); }\n    50% { box-shadow: 0 0 0 7px oklch(0.74 0.14 68 / 0.35); }\n    100% { box-shadow: 0 0 0 3px oklch(0.74 0.14 68 / 0.55); }\n  }\n  @keyframes mm-fill-x { to { transform: scaleX(1); } }\n  @keyframes mm-fill-y { to { transform: scaleY(1); } }\n  /* Narrow screens: steps stack and the line runs downward */\n  @container (max-width: 560px) {\n    .mm-steps-row { flex-direction: column; gap: 0; }\n    .mm-step { flex-direction: row; gap: 12px; padding: 8px 0; }\n    .mm-step-line { top: 44px; bottom: -2px; left: 14px; right: auto; width: 2px; height: auto; }\n    .mm-step-fill { transform: scaleY(0); transform-origin: top; animation-name: mm-fill-y; }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .mm-step-dot, .mm-step-fill { animation-duration: 0s; animation-delay: 0s; }\n    .mm-step-dot, .mm-step-title { transition: none; }\n    .mm-step:hover .mm-step-dot { transform: none; }\n  }\n\n  /* Click-to-open offer cards and steps */\n  .mm-toggle { all: unset; box-sizing: border-box; cursor: pointer; display: flex; width: 100%; -webkit-tap-highlight-color: transparent; }\n  .mm-toggle:focus-visible { outline: 2px solid oklch(0.74 0.14 68); outline-offset: 4px; border-radius: 3px; }\n  .mm-card-head { flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 26px 20px 20px; }\n  .mm-card-icon { font-size: 34px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1); }\n  .mm-chev { display: inline-block; width: 8px; height: 8px; margin-top: 8px; border-right: 2px solid #9aa3ac; border-bottom: 2px solid #9aa3ac; transform: rotate(45deg); transition: transform 0.35s ease, border-color 0.2s ease; }\n  .mm-toggle:hover .mm-chev { border-color: #16202b; }\n  .is-open .mm-chev { transform: translate(0, 4px) rotate(225deg); border-color: oklch(0.62 0.13 62); }\n  .mm-collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }\n  .is-open .mm-collapse { grid-template-rows: 1fr; }\n  .mm-collapse-inner { display: block; overflow: hidden; min-height: 0; }\n  .mm-reveal { opacity: 0; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease; }\n  .is-open .mm-reveal { opacity: 1; transform: none; transition: opacity 0.4s ease, transform 0.4s ease; }\n  .is-open .mm-reveal:nth-child(1) { transition-delay: 0.10s; }\n  .is-open .mm-reveal:nth-child(2) { transition-delay: 0.18s; }\n  .is-open .mm-reveal:nth-child(3) { transition-delay: 0.26s; }\n  .mm-card-body { display: flex; flex-direction: column; gap: 11px; padding: 0 20px 20px; }\n  .mm-step-toggle { flex-direction: column; gap: 9px; text-align: left; }\n  .mm-step-title .mm-chev { width: 6px; height: 6px; margin: 0 0 3px 9px; vertical-align: middle; }\n  @container (max-width: 560px) { .mm-step-toggle { flex-direction: row; gap: 12px; align-items: flex-start; } }\n  @media (prefers-reduced-motion: reduce) {\n    .mm-collapse, .mm-reveal, .mm-chev, .mm-card-icon { transition: none !important; }\n    .mm-card:hover .mm-card-icon { transform: none; }\n  }\n\n  /* \"Selected work\": click a project to show its description */\n  .is-w-open .mm-w-chev { transform: translate(0, 3px) rotate(225deg); border-color: oklch(0.74 0.14 68); }\n  .is-w-open .mm-w-collapse { grid-template-rows: 1fr; }\n  .is-w-open .mm-w-desc { opacity: 1; transform: none; transition: opacity 0.35s ease 0.1s, transform 0.35s ease 0.1s; }\n  @media (prefers-reduced-motion: reduce) {\n  }\n\n  /* Language chips: round flag, name, level and a CEFR meter that fills in */\n  /* No  lNow: \"Attualmente\",\n    company: \"Palladio Group - dal 2025\",\n    based: \"Serbia · Da remoto\",\n    eduDeg: \"MSc e BSc in Ingegneria del software\",\n    eduSchool: \"Facoltà Tecnica “Mihajlo Pupin”, Università di Novi Sad\",\n    eduYears: \"2020 – 2025\",\n    short: \"Software, automazioni e strumenti di AI che togliono lavoro dalle mani delle persone - e riparazioni per ciò che smette di funzionare.\",\n    avail: \"Disponibile per nuovi progetti\",\n    l1n: \"Serbo\", l1l: \"Madrelingua\", l2n: \"Inglese\", l2l: \"C1\", l3n: \"Italiano\", l3l: \"B1\",\n    lServices: \"Servizi\",\n    lAbout: \"Chi sono\", kBased: \"Sede\", kEdu: \"Formazione\", lLangs: \"Lingue\", lContact: \"Contatti\", contactHead: \"Preferisci scrivere? Contattami direttamente.\", scroll: \"Scorri\", bookShort: \"Prenota una call\", rights: \"Tutti i diritti riservati.\",\n    lWork: \"Lavori selezionati\",\n    work: [\n      { title: \"Automazione e AI\", tag: \"In produzione\", desc: \"Collegamento di API di AI per automatizzare i processi manuali su piattaforme di gestione dei processi.\" },\n      { title: \"TrainingApp\", tag: \"Desktop\", desc: \"App desktop per l'allenamento - schede, grafici dei progressi e monitoraggio della nutrizione.\" },\n      { title: \"Sistema di gestione biblioteca\", tag: \"App\", desc: \"Prestiti di libri, controllo delle copie, ruoli utente (admin, bibliotecario, utente) e recensioni.\" }\n    ],\n    lOffers: \"Cosa offro\", lGet: \"Cosa ottieni\", lHow: \"Come funziona\", lProcess: \"Come lavoriamo\",\n    offers: [\n      { name: \"Sviluppo\", sub: \"Software e app su misura\", forWho: \"Ci serve uno strumento o un'app che ancora non esiste.\",\n        gets: [\"App web, desktop o mobile costruita sul tuo modo di lavorare\", \"Codice sorgente e hosting intestati a te\", \"Correzione dei bug dopo il lancio\"],\n        how: \"Concordiamo ambito e prezzo in una proposta scritta, poi lo sviluppo per fasi che puoi testare strada facendo.\" },\n      { name: \"Collegamento e automazione\", sub: \"Integrazioni e AI\", forWho: \"I nostri strumenti non si parlano e ogni giorno facciamo lo stesso lavoro a mano.\",\n        gets: [\"Gli strumenti che già usi, collegati tramite API\", \"Attività ripetitive automatizzate - report, inserimento dati, email\", \"Assistenti AI pratici che lavorano con i tuoi documenti\"],\n        how: \"Si parte da un processo, si misura quanto tempo fa risparmiare, poi si passa al successivo.\" },\n      { name: \"Assistenza\", sub: \"Help desk e manutenzione\", forWho: \"Ci serve qualcuno da chiamare quando qualcosa si rompe.\",\n        gets: [\"Assistenza tecnica per il tuo team, da remoto\", \"Manutenzione mensile, aggiornamenti e backup\", \"Documentazione e formazione per un team autonomo\"],\n        how: \"Un piano mensile: segnali un problema e lo risolvo - più controlli regolari per prevenire i guasti.\" }\n    ],\n    steps: [\n      { title: \"Call gratuita di 20 min\", desc: \"Parliamo del problema.\" },\n      { title: \"Proposta scritta\", desc: \"Ambito, tempi e prezzo.\" },\n      { title: \"Sviluppo\", desc: \"Aggiornamenti regolari sui progressi.\" },\n      { title: \"Consegna e formazione\", desc: \"Documentazione, formazione e supporto.\" }\n    ],\n    book: \"Prenota una call gratuita di 20 min\",\n    ctaHead: \"Hai qualcosa da costruire, collegare o riparare?\",\n    ctaSub: \"Raccontamelo in una breve call - gratis e senza impegno.\",\n    mailSubject: \"Call gratuita di 20 min\",\n    bmTitle: \"Parliamo del tuo progetto\", bmText: \"Scrivimi una breve email su ciò che ti serve e qualche orario che ti va bene: ti risponderò per fissare la call.\", bmGmail: \"Scrivi in Gmail\", bmApp: \"Apri l'app email\", bmCopy: \"Copia l'indirizzo email\", bmClose: \"Chiudi\", mailBody: \"Ciao Miloš,\\n\\nVorrei una call gratuita di 20 min riguardo a:\\n\\n\\nOrari che mi vanno bene:\\n\\n\",\n    waText: \"Ciao Miloš, ho visto il tuo sito e vorrei parlarti di un progetto.\",\n    services: [\n      { n: \"01\", name: \"Programmazione\", desc: \"Web, desktop, script — qualsiasi tipo di codice.\" },\n      { n: \"02\", name: \"Sviluppo di applicazioni\", desc: \"Progetti completi, dall'idea all'app in produzione.\" },\n      { n: \"03\", name: \"Integrazione di sistemi\", desc: \"Strumenti che non si parlano, finalmente collegati.\" },\n      { n: \"04\", name: \"Soluzioni AI\", desc: \"Strumenti di AI integrati nel tuo lavoro.\" },\n      { n: \"05\", name: \"Assistenza tecnica\", desc: \"Quando qualcosa si rompe e serve subito.\" },\n      { n: \"06\", name: \"Manutenzione e supporto\", desc: \"Cura continua di ciò che è già in funzione.\" },\n      { n: \"07\", name: \"Documentazione e formazione\", desc: \"Perché il team sappia usare il nuovo sistema.\" }\n    ]\n  }\n};\n\nconst OFFER_EMOJIS = [\"🧩\", \"🔌\", \"🛠️\"];\nconst EMOJIS = [\"💻\", \"🧩\", \"🔌\", \"🤖\", \"🛠️\", \"🔄\", \"📘\"];\nconst COPIED = { sr: \"kopirano\", en: \"copied\", it: \"copiato\" };\nconst COPY_CTA = { sr: \"kopiraj\", en: \"copy\", it: \"copia\" };\n\nclass Component extends DCLogic {\n  state = { lang: null, copied: false, openCards: {}, openSteps: {}, openWork: {}, navOpen: false, bookOpen: false };\n\n  // \"Book a call\": with a booking link the buttons just open it; without one they open a small\n  // window with ways to email me (a plain mailto link does nothing on computers without a mail app).\n  bookClick = (e) => {\n    if (BOOKING_URL) { this.setState({ navOpen: false }); return; }\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState({ bookOpen: true, navOpen: false });\n    try { document.documentElement.style.overflow = \"hidden\"; } catch (err) {}\n  };\n  closeBook = () => {\n    this.setState({ bookOpen: false });\n    try { document.documentElement.style.overflow = \"\"; } catch (err) {}\n  };\n  componentDidUpdate(prevProps, prevState) {\n    try {\n      if (this.state.bookOpen && !(prevState && prevState.bookOpen)) {\n        const x = document.querySelector(\".mm-modal-x\"); if (x) x.focus();\n      }\n    } catch (e) {}\n  }\n\n  toggleNav = () => this.setState(st => ({ navOpen: !st.navOpen }));\n  closeNav = () => this.setState({ navOpen: false });\n\n  // Underline the menu link of the section currently on screen.\n  navCheck = () => {\n    try {\n      let current = null;\n      for (const id of [\"about\", \"work\", \"offers\", \"process\", \"contact\"]) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= 140) current = id;\n      }\n      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = \"contact\";\n      document.querySelectorAll(\"[data-nav]\").forEach(a => a.classList.toggle(\"is-active\", a.getAttribute(\"data-nav\") === current));\n    } catch (e) {}\n  };\n\n  // Offer cards and \"How we work\" steps open/close on click.\n  toggleCard = (i) => this.setState(st => ({ openCards: Object.assign({}, st.openCards, { [i]: !st.openCards[i] }) }));\n  toggleStep = (i) => this.setState(st => ({ openSteps: Object.assign({}, st.openSteps, { [i]: !st.openSteps[i] }) }));\n\n  componentDidMount() {\n    this._onKey = (e) => { if (e.key === \"Escape\" && this.state.bookOpen) this.closeBook(); };\n    document.addEventListener(\"keydown\", this._onKey);\n    this.setupReveal();\n    this.setupHeroFx();\n    this._fields = [this.setupParticleField(document.querySelector(\".mm-cta-sec\"))].filter(Boolean);\n    this.setupSmoothLinks();\n    // ?lang=sr / ?lang=it in the link wins over the remembered choice.\n    let fromUrl = null;\n    try { fromUrl = new URLSearchParams(window.location.search).get(\"lang\"); } catch (e) {}\n    if (fromUrl && COPY[fromUrl.toLowerCase()]) { this.setLang(fromUrl.toLowerCase(), false); return; }\n    let saved = null;\n    try { saved = localStorage.getItem(\"mm-site-lang\"); } catch (e) {}\n    if (saved && COPY[saved]) this.setState({ lang: saved });\n    try { document.documentElement.lang = this.lang(); } catch (e) {}\n  }\n\n  lang() { return this.state.lang || this.props.defaultLang || \"en\"; }\n\n  setLang = (lang, updateUrl = true) => {\n    try { localStorage.setItem(\"mm-site-lang\", lang); } catch (e) {}\n    try { document.documentElement.lang = lang; } catch (e) {}\n    // Keep the address bar in sync so a copied link opens in the same language.\n    if (updateUrl) {\n      try {\n        const u = new URL(window.location.href);\n        u.searchParams.set(\"lang\", lang);\n        window.history.replaceState(null, \"\", u.toString());\n      } catch (e) {}\n    }\n    const changed = lang !== this.lang();\n    this.setState({ lang, copied: false });\n    if (updateUrl && changed) requestAnimationFrame(() => this.replayEntrance());\n  };\n\n  // Re-plays a staggered fade-up of every block, so switching language\n  // feels like the page appearing again in the new language.\n  // Sections fade up the first time they scroll into view.\n  setupReveal() {\n    try {\n      const root = document.querySelector(\".mm-root\");\n      if (!root || !(\"IntersectionObserver\" in window)) return;\n      root.classList.add(\"mm-js-rv\");\n      this._io = new IntersectionObserver((entries) => entries.forEach((e) => {\n        if (e.isIntersecting) { e.target.classList.add(\"is-in\"); this._io.unobserve(e.target); }\n      }), { threshold: 0.12, rootMargin: \"0px 0px -40px 0px\" });\n      document.querySelectorAll(\".mm-rv\").forEach((el) => this._io.observe(el));\n      // Backup for browsers that delay the observer: a plain position check on scroll/resize.\n      this._revealCheck = () => {\n        const vh = window.innerHeight;\n        document.querySelectorAll(\".mm-rv:not(.is-in)\").forEach((el) => {\n          const r = el.getBoundingClientRect();\n          if (r.top < vh - 40 && r.bottom > 0) el.classList.add(\"is-in\");\n        });\n      };\n      window.addEventListener(\"scroll\", this._revealCheck, { passive: true });\n      window.addEventListener(\"scroll\", this.navCheck, { passive: true });\n      setTimeout(this.navCheck, 60);\n      window.addEventListener(\"resize\", this._revealCheck);\n      setTimeout(this._revealCheck, 60);\n    } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    try {\n      this._io && this._io.disconnect();\n      document.removeEventListener(\"keydown\", this._onKey);\n      this.teardownHeroFx();\n      (this._fields || []).forEach((f) => f.stop());\n      document.removeEventListener(\"click\", this._linkClick);\n      window.removeEventListener(\"scroll\", this._revealCheck);\n      window.removeEventListener(\"scroll\", this.navCheck);\n      window.removeEventListener(\"resize\", this._revealCheck);\n    } catch (e) {}\n  }\n\n  // Opening screen: drifting particle network (reacts to the mouse) + pulses travelling along the node graphic.\n  setupHeroFx() {\n    try {\n      const hero = document.getElementById(\"top\");\n      const pc = hero && hero.querySelector(\".mm-particles\");\n      if (!pc || !pc.getContext) return;\n      let reduce = false;\n      try { reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches; } catch (e) {}\n      const dpr = Math.min(window.devicePixelRatio || 1, 2);\n      const fx = this._fx = { parts: [], mouse: null, last: performance.now(), raf: 0, alive: true };\n      const fit = (cv) => {\n        const w = cv.clientWidth, h = cv.clientHeight;\n        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);\n        const ctx = cv.getContext(\"2d\"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n        return { ctx, w, h };\n      };\n      const seed = () => {\n        fx.p = fit(pc);\n        const n = Math.max(24, Math.min(90, Math.round(fx.p.w * fx.p.h / 15000)));\n        fx.parts = Array.from({ length: n }, () => ({\n          x: Math.random() * fx.p.w, y: Math.random() * fx.p.h,\n          vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0
